<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cambiar contraseña | TarotAnuncia</title>
<style>
:root{--gold:#d89400;--gold2:#efb326;--ink:#171526;--cream:#fffaf1;--line:#eadfce}*{box-sizing:border-box}body{margin:0;background:#fbfaf6;color:var(--ink);font-family:Arial,system-ui,sans-serif;min-height:100vh}header{background:#fff;border-bottom:1px solid #eee4d6}.brand{display:flex;align-items:center;gap:11px;max-width:1050px;margin:auto;padding:10px 20px;text-decoration:none;color:inherit}.brand img{width:48px;height:48px;object-fit:contain}.brandName{font:700 27px Georgia,serif}.brandName span{color:#b97800}.tagline{font-size:9px;letter-spacing:1.1px;color:#766a60;margin-top:2px}.container{width:min(100% - 32px,490px);margin:58px auto 45px;background:#fff;border:1px solid var(--line);border-radius:19px;padding:31px;box-shadow:0 9px 30px #4c36151a}h1{font:700 30px Georgia,serif;margin:0 0 12px}p{line-height:1.6;color:#665d61}.field{margin:20px 0 12px}label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}input{width:100%;border:1px solid #ddcfb9;border-radius:11px;padding:14px;font:inherit;outline-color:#d89400}button.primary{width:100%;border:0;border-radius:13px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;font-weight:800;font-size:16px;padding:15px;cursor:pointer;margin-top:12px}button:disabled{opacity:.6;cursor:wait}.message{padding:12px;border-radius:10px;background:#fff6df;color:#6b4a09;margin:16px 0;display:none;line-height:1.5}.message.error{background:#fff0f0;color:#9b2020}.message.success{background:#eaf8ed;color:#185b30}.small{font-size:13px}.back{display:block;text-align:center;color:#855a09;margin-top:24px;text-decoration:none;font-weight:700}footer{text-align:center;font-size:12px;color:#827870;padding:20px}@media(max-width:520px){.container{margin:28px auto;padding:23px}.brandName{font-size:23px}h1{font-size:26px}}
</style></head><body>
<header><a class="brand" href="https://tarotanuncia.es/"><img src="https://tarotanuncia.es/file_000000003c088210be49f3122608d83d.png" alt="Logo de TarotAnuncia"><div><div class="brandName">Tarot<span>Anuncia</span></div><div class="tagline">TU ESPACIO PROFESIONAL</div></div></a></header>
<main class="container"><h1>Crea tu nueva contraseña</h1><p>Por seguridad, comprueba el enlace recibido en tu correo y establece una contraseña nueva para tu cuenta.</p><div id="message" class="message" role="status" aria-live="polite"></div>
<form id="form" hidden><div class="field"><label for="password">Nueva contraseña</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Mínimo 8 caracteres"></div><div class="field"><label for="confirm">Confirmar nueva contraseña</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Repite la contraseña"></div><button id="submit" class="primary" type="submit">Guardar nueva contraseña</button></form>
<a class="back" href="https://tarotanuncia.es/">Volver a TarotAnuncia</a></main><footer>© TarotAnuncia · Protección y seguridad de tu cuenta</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://ozbbgfxixbgffxnhqpzh.supabase.co','sb_publishable_Xag7GClzJc37vg2DQXhBVA_QfU0NUyd',{auth:{detectSessionInUrl:true,persistSession:false,autoRefreshToken:false}});
const box=document.getElementById('message'),form=document.getElementById('form');
function message(t,kind=''){box.style.display='block';box.className='message '+kind;box.textContent=t}
(async()=>{message('Comprobando tu enlace seguro…');try{
 const q=new URLSearchParams(location.search);const token=q.get('token_hash');const type=q.get('type');
 if(token&&type==='recovery'){const {error}=await sb.auth.verifyOtp({token_hash:token,type:'recovery'});if(error)throw error;history.replaceState(null,'',location.pathname)}
 else if(location.hash.includes('access_token=')){const h=new URLSearchParams(location.hash.slice(1));if(h.get('error'))throw Error('Enlace no válido');const {error}=await sb.auth.setSession({access_token:h.get('access_token')||'',refresh_token:h.get('refresh_token')||''});if(error)throw error;history.replaceState(null,'',location.pathname)}
 else if(q.get('error')||q.get('error_code'))throw Error('Enlace caducado o inválido');
 const {data:{session},error}=await sb.auth.getSession();if(error||!session)throw Error('Enlace no válido o caducado');
 box.style.display='none';form.hidden=false;
 }catch(e){form.hidden=true;message('Este enlace no es válido o ha caducado. Solicita uno nuevo desde «Iniciar sesión» en TarotAnuncia.','error')}})();
form.addEventListener('submit',async e=>{e.preventDefault();const pass=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(pass.length<8)return message('La contraseña debe tener al menos 8 caracteres.','error');if(pass!==confirm)return message('Las contraseñas no coinciden.','error');const btn=document.getElementById('submit');btn.disabled=true;message('Guardando contraseña…');try{const {error}=await sb.auth.updateUser({password:pass});if(error)throw error;form.hidden=true;message('Contraseña actualizada correctamente. Ya puedes iniciar sesión.','success');await sb.auth.signOut()}catch(e){message('No se pudo cambiar la contraseña. Comprueba que cumpla los requisitos e inténtalo de nuevo.','error')}finally{btn.disabled=false}});
</script></body></html>
