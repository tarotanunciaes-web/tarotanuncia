<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TarotAnuncia · Administración</title><style>body{font-family:system-ui;margin:0;background:#f7f3fb;color:#252033}.wrap{max-width:1100px;margin:auto;padding:24px}.box{background:#fff;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 30px #0000000d}input{padding:12px;border:1px solid #ddd;border-radius:10px;width:100%;margin:6px 0 12px;box-sizing:border-box}button{padding:11px 15px;border:0;border-radius:10px;background:#6d25c9;color:white;font-weight:700;cursor:pointer}.danger{background:#a52252}.muted{color:#777}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #eee;padding:16px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:99px;background:#eee6ff;color:#6424bd;font-size:12px;font-weight:700}</style></head><body><div class="wrap"><h1>🔮 TarotAnuncia · Administración</h1><p class="muted">Panel privado para revisar anuncios.</p><div id="login" class="box"><h2>Acceso</h2><input id="email" type="email" placeholder="Tu Gmail"><input id="password" type="password" placeholder="Contraseña"><button id="go">Entrar / crear cuenta</button><p id="msg" class="muted"></p></div><div id="panel" style="display:none"><div class="box"><b id="who"></b><button style="float:right" id="out">Salir</button></div><div class="box"><h2>Anuncios pendientes</h2><div id="ads">Cargando...</div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ozbbgfxixbgffxnhqpzh.supabase.co','sb_publishable_Xag7GClzJc37vg2DQXhBVA_QfU0NUyd');const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}async function isAdmin(){const{data:{user}}=await db.auth.getUser();if(!user)return null;const{data}=await db.from('tarotanuncia_admins').select('user_id').eq('user_id',user.id).maybeSingle();return data?user:null}async function show(){const u=await isAdmin();if(!u){$('login').style.display='block';$('panel').style.display='none';return}$('login').style.display='none';$('panel').style.display='block';$('who').textContent='Sesión: '+u.email;load();}async function load(){const{data,error}=await db.from('tarotist_ads').select('*').order('created_at',{ascending:false});if(error){$('ads').textContent=error.message;return}if(!data.length){$('ads').innerHTML='<p class="muted">No hay anuncios.</p>';return}$('ads').innerHTML=data.map(a=>`<div class="row"><div><b>${esc(a.display_name)}</b><br><span class="pill">${esc(a.status)}</span> ${esc(a.title)}<br><span class="muted">${esc(a.city||'')} · ${esc(a.modality||'')}</span></div><div class="actions">${a.status!=='approved'?`<button onclick="setStatus('${a.id}','approved')">Aprobar</button>`:''}${a.status!=='rejected'?`<button class="danger" onclick="setStatus('${a.id}','rejected')">Rechazar</button>`:''}${a.status!=='paused'?`<button onclick="setStatus('${a.id}','paused')">Pausar</button>`:''}</div></div>`).join('')}async function setStatus(id,status){const{error}=await db.from('tarotist_ads').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()}$('go').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;$('msg').textContent='Conectando...';let r=await db.auth.signInWithPassword({email,password});if(r.error)r=await db.auth.signUp({email,password});$('msg').textContent=r.error?r.error.message:'Cuenta creada/iniciada. Si no tienes permisos de administrador, hay que añadir tu cuenta al panel.';setTimeout(show,700)};$('out').onclick=async()=>{await db.auth.signOut();show()};db.auth.onAuthStateChange(()=>show());show();</script></body></html>
