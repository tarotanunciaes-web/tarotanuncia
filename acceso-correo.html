<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acceso por correo | TarotAnuncia</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf7f0;color:#25192c;font:16px Arial,sans-serif}
header{background:#fff;border-bottom:1px solid #e7d9bf;padding:20px;text-align:center}
header a{color:#7e540b;text-decoration:none;font:700 29px Georgia,serif}
main{max-width:480px;margin:65px auto;padding:30px;background:#fff;border:1px solid #e7d9bf;border-radius:20px;box-shadow:0 12px 32px #25192c0c}
h1{font:700 27px Georgia,serif;margin:0 0 15px}p{line-height:1.55;color:#655b66}
label{display:block;font-weight:700;margin:24px 0 8px}input{width:100%;padding:15px;border:1px solid #d8c5a4;border-radius:12px;font:inherit}
button{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(120deg,#f0b93a,#c48b14);color:#fff;font-weight:800;font-size:16px;margin-top:17px;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}#status{min-height:24px;font-size:14px}a.back{display:block;text-align:center;margin-top:22px;color:#855b12}
@media(max-width:540px){main{margin:25px 14px;padding:24px}}
</style>
</head>
<body>
<header><a href="https://tarotanuncia.es/">TarotAnuncia</a></header>
<main>
<h1>Acceder con mi correo</h1>
<p>Te enviaremos un enlace seguro para iniciar sesión sin escribir ni cambiar tu contraseña.</p>
<form id="loginForm">
<label for="email">Correo electrónico</label>
<input id="email" type="email" autocomplete="email" placeholder="tu@email.com" required>
<button id="send" type="submit">Enviar enlace de acceso</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<a class="back" href="https://tarotanuncia.es/">Volver a TarotAnuncia</a>
</main>
<script>
const BASE='https://ozbbgfxixbgffxnhqpzh.supabase.co';
const KEY='sb_publishable_Xag7GClzJc37vg2DQXhBVA_QfU0NUyd';
const REDIRECT='https://tarotanuncia.es/acceso-correo.html';
const statusEl=document.getElementById('status');
function status(t){statusEl.textContent=t;}
async function finishLogin(){
  const hash=new URLSearchParams(location.hash.slice(1));
  const query=new URLSearchParams(location.search);
  let session;
  try{
    if(hash.get('error')||query.get('error')) throw Error('Enlace caducado o no válido.');
    if(hash.get('access_token')&&hash.get('refresh_token')){
      session={access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')};
    }else if(query.get('token_hash')&&['magiclink','email'].includes(query.get('type'))){
      const r=await fetch(BASE+'/auth/v1/verify',{
        method:'POST',
        headers:{apikey:KEY,'Content-Type':'application/json'},
        body:JSON.stringify({token_hash:query.get('token_hash'),type:query.get('type')})
      });
      if(!r.ok)throw Error('El enlace ha caducado o no es válido.');
      session=await r.json();
    }else return;
    if(!session.access_token||!session.refresh_token)throw Error('No se ha podido iniciar sesión.');
    // Verificar el token antes de almacenarlo
    const verify=await fetch(BASE+'/auth/v1/user',{
      headers:{apikey:KEY,Authorization:'Bearer '+session.access_token}
    });
    if(!verify.ok)throw Error('No se pudo verificar la sesión.');
    localStorage.setItem('tarotanuncia_access_token',session.access_token);
    localStorage.setItem('tarotanuncia_refresh_token',session.refresh_token);
    history.replaceState(null,'',location.pathname);
    status('Acceso correcto. Abriendo tu panel…');
    location.replace('https://tarotanuncia.es/panel.html');
  }catch(e){
    history.replaceState(null,'',location.pathname);
    status(e.message||'No se pudo completar el acceso. Solicita otro enlace.');
  }
}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const button=document.getElementById('send');
  if(!email)return;
  button.disabled=true;
  status('Solicitando enlace seguro…');
  try{
    const r=await fetch(BASE+'/auth/v1/otp?redirect_to='+encodeURIComponent(REDIRECT),{
      method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,create_user:false})
    });
    if(!r.ok)throw Error('No se pudo enviar el enlace. Inténtalo más tarde.');
    status('Si la cuenta existe, llegará un enlace a ese correo. Revisa también Spam. Tu contraseña no cambia.');
  }catch(err){status(err.message||'No se pudo solicitar el acceso.');}
  finally{button.disabled=false;}
});
finishLogin();
</script>
</body>
</html>
