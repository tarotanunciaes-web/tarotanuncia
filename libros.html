<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Libros de tarot y espiritualidad | TarotAnuncia</title><meta name="description" content="Descubre libros de tarot, espiritualidad, astrología y esoterismo. Compra directamente al autor o en su tienda."><style>body{margin:0;background:#faf6ee;color:#35203d;font-family:system-ui,sans-serif}header{background:white;border-bottom:1px solid #e7dcc6;padding:20px;text-align:center}h1,h2{font-family:Georgia,serif}header a{color:#825b13}main{max-width:1120px;margin:auto;padding:28px 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}.book{background:#fff;border:1px solid #e7dcc6;border-radius:18px;padding:16px;box-shadow:0 7px 25px #4e36100b}.book img{width:100%;height:280px;object-fit:contain;background:#fffaf0;border-radius:10px}.book p{overflow-wrap:anywhere;white-space:pre-line}.buy,button{background:#b8892b;color:#fff;border:0;border-radius:10px;padding:11px 15px;display:inline-block;text-decoration:none;cursor:pointer}.controls{display:flex;gap:12px;align-items:center;justify-content:center;margin:25px}.muted{color:#746979}</style></head><body><header><h1>Biblioteca TarotAnuncia</h1><p>Libros de tarot, espiritualidad y esoterismo</p><a href="/">Volver a TarotAnuncia</a></header><main><p>Descubre obras de autores independientes. Las compras se realizan fuera de TarotAnuncia, directamente en el enlace indicado por cada autor.</p><div id="books" class="grid"></div><p id="msg" class="muted" role="status"></p><div class="controls"><button id="prev">Anterior</button><span id="page">Página 1</span><button id="next">Siguiente</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://ozbbgfxixbgffxnhqpzh.supabase.co','sb_publishable_Xag7GClzJc37vg2DQXhBVA_QfU0NUyd');
let page=0;const limit=12;
async function load(){const el=document.getElementById('books'),msg=document.getElementById('msg');el.replaceChildren();msg.textContent='Cargando libros…';const {data,error}=await db.from('ta_books').select('title,author,description,category,price,cover_url,purchase_url').eq('status','approved').order('created_at',{ascending:false}).range(page*limit,(page+1)*limit);if(error){msg.textContent='No se pudieron cargar los libros: '+error.message;return}msg.textContent=data.length?'':'Todavía no hay libros aprobados.';for(const b of data.slice(0,limit)){const card=document.createElement('article');card.className='book';if(b.cover_url){const img=document.createElement('img');img.src=b.cover_url;img.alt='Portada de '+b.title;img.loading='lazy';card.append(img)}const title=document.createElement('h2');title.textContent=b.title;card.append(title);for(const value of [b.author,b.category,b.price==null?'Precio a consultar':Number(b.price).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),b.description]){const p=document.createElement('p');p.textContent=value;card.append(p)}if(/^https:\/\//i.test(b.purchase_url)){const a=document.createElement('a');a.href=b.purchase_url;a.target='_blank';a.rel='noopener noreferrer';a.className='buy';a.textContent='Ver dónde comprar';card.append(a)}el.append(card)}document.getElementById('page').textContent='Página '+(page+1);document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=data.length<=limit}
document.getElementById('prev').onclick=()=>{if(page){page--;load()}};document.getElementById('next').onclick=()=>{page++;load()};load();
</script></body></html>
