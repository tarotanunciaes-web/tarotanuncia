<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba PayPal Sandbox | TarotAnuncia</title>
<style>
body{font:16px system-ui,sans-serif;background:#f7f8fc;color:#222;margin:0;padding:24px}
.wrap{max-width:460px;margin:55px auto;background:#fff;padding:26px;border-radius:18px;box-shadow:0 8px 28px #18234413}
h1{font-size:23px}p{line-height:1.55}
button{display:block;width:100%;border:0;border-radius:12px;background:#174ea6;color:#fff;font-size:17px;padding:16px;margin:12px 0}
button:disabled{opacity:.6}a{color:#174ea6}#status{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="wrap">
<h1>TarotAnuncia · PayPal Sandbox</h1>
<p><strong>Solo pruebas.</strong> Los pagos son ficticios. Esta página no activa planes reales.</p>
<p>Inicia sesión primero en <a href="/panel.html">tu panel de TarotAnuncia</a> desde este mismo navegador.</p>
<button data-plan="destacado">Probar Destacado · 9,99 €</button>
<button data-plan="premium">Probar Premium · 19,99 €</button>
<p id="status" role="status"></p>
<p><a href="/panel.html">Volver al panel</a></p>
</main>
<script>
const base='https://ozbbgfxixbgffxnhqpzh.supabase.co';
const key='sb_publishable_Xag7GClzJc37vg2DQXhBVA_QfU0NUyd';
const status=document.querySelector('#status');
const query=new URLSearchParams(location.search);
if(query.has('token')) {
 status.textContent='Verificando y capturando el pago ficticio con PayPal Sandbox...';
 (async()=>{
  const jwt=token();
  if(!jwt){status.textContent='Debes iniciar sesión en tu panel para confirmar esta prueba. No se ha activado ningún plan.';return;}
  try{
   const r=await fetch(base+'/functions/v1/paypal-sandbox-capture-order',{
    method:'POST',headers:{Authorization:'Bearer '+jwt,apikey:key,'Content-Type':'application/json'},
    body:JSON.stringify({orderId:query.get('token')})
   });
   const data=await r.json();
   if(!r.ok)throw Error(data.error||data.message||'Error '+r.status);
   status.textContent=data.paid&&data.sandbox
    ? 'Pago ficticio CONFIRMADO en PayPal Sandbox. Plan de prueba: '+data.plan+'. No se ha activado ningún plan real.'
    : 'PayPal todavía no confirma el cobro ficticio. Estado: '+(data.status||'desconocido');
  }catch(e){status.textContent='No se pudo verificar la compra ficticia: '+e.message;}
 })();
}
else if(query.has('cancel')) status.textContent='Prueba cancelada. No se ha cobrado nada.';
function token(){return localStorage.getItem('tarotanuncia_access_token')||sessionStorage.getItem('tarotanuncia_access_token')}
document.querySelectorAll('button[data-plan]').forEach(b=>b.addEventListener('click',async()=>{
 const jwt=token();
 if(!jwt){status.textContent='Inicia sesión en el panel primero.';return;}
 document.querySelectorAll('button').forEach(x=>x.disabled=true);
 status.textContent='Creando orden ficticia...';
 try{
  const r=await fetch(base+'/functions/v1/paypal-sandbox-create-order',{
   method:'POST',headers:{Authorization:'Bearer '+jwt,apikey:key,'Content-Type':'application/json'},
   body:JSON.stringify({plan:b.dataset.plan})
  });
  const data=await r.json();
  if(!r.ok)throw Error(data.error||data.message||'Error '+r.status);
  if(!data.approvalUrl||!/^https:\/\/(www\.)?sandbox\.paypal\.com\//i.test(data.approvalUrl))throw Error('PayPal no devolvió un enlace Sandbox válido.');
  location.assign(data.approvalUrl);
 }catch(e){status.textContent='No se pudo iniciar la prueba: '+e.message;document.querySelectorAll('button').forEach(x=>x.disabled=false);}
}));
</script>
</body>
</html>
